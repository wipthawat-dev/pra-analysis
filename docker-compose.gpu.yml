version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: ./apps/web-next/Dockerfile
    container_name: web-next
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: ./apps/amulet_ai_service/Dockerfile
    container_name: amulet-ai-service
    environment:
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - TRITON_GRPC_URL=${TRITON_GRPC_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBED_DIM=${EMBED_DIM}
      - S3_ENDPOINT=${S3_ENDPOINT:-seaweedfs-s3:8333}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-seaweedfs_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-seaweedfs_secret}
      - S3_SECURE=${S3_SECURE:-false}
      - S3_REGION=${S3_REGION:-us-east-1}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-amulet_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./scripts:/app/scripts
      - ./ml/inference/triton_model_repo:/models
    ports:
      - "8000:8000"
    depends_on:
      - triton
      - qdrant
      - seaweedfs-s3
      - postgres

  triton:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    container_name: triton
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: ["tritonserver", "--model-repository=/models"]
    volumes:
      - ./ml/inference/triton_model_repo:/models
    ports:
      - "8001:8001"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # SeaweedFS Master Servers (HA Configuration)
  seaweedfs-master1:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master1
    command: 'master -ip=seaweedfs-master1 -port=9333 -peers=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 -defaultReplication=001'
    ports:
      - "9333:9333"
    volumes:
      - seaweedfs_master1:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  seaweedfs-master2:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master2
    command: 'master -ip=seaweedfs-master2 -port=9334 -peers=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 -defaultReplication=001'
    ports:
      - "9334:9334"
    volumes:
      - seaweedfs_master2:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9334/cluster/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  seaweedfs-master3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-master3
    command: 'master -ip=seaweedfs-master3 -port=9335 -peers=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 -defaultReplication=001'
    ports:
      - "9335:9335"
    volumes:
      - seaweedfs_master3:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9335/cluster/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # SeaweedFS Volume Servers
  seaweedfs-volume1:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume1
    command: 'volume -mserver=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 -ip=seaweedfs-volume1 -port=8080 -max=100'
    ports:
      - "8080:8080"
    volumes:
      - seaweedfs_volume1:/data
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  seaweedfs-volume2:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume2
    command: 'volume -mserver=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 -ip=seaweedfs-volume2 -port=8081 -max=100'
    ports:
      - "8081:8081"
    volumes:
      - seaweedfs_volume2:/data
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # SeaweedFS Filer (Filesystem Interface)
  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-filer
    command: 'filer -master=seaweedfs-master1:9333,seaweedfs-master2:9334,seaweedfs-master3:9335 -ip=seaweedfs-filer'
    ports:
      - "8888:8888"
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master1
      - seaweedfs-master2
      - seaweedfs-master3
      - seaweedfs-volume1
      - seaweedfs-volume2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # SeaweedFS S3 Gateway (S3-Compatible API)
  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-s3
    command: 's3 -filer=seaweedfs-filer:8888 -ip=seaweedfs-s3 -port=8333 -config=/etc/seaweedfs/s3.json'
    ports:
      - "8333:8333"
    environment:
      - WEED_ACCESS_KEY_ID=seaweedfs_admin
      - WEED_SECRET_ACCESS_KEY=seaweedfs_secret
    volumes:
      - ./config/seaweedfs:/etc/seaweedfs
    depends_on:
      - seaweedfs-filer
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-amulet_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/schemas/sql.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  qdrant_data:
  seaweedfs_master1:
  seaweedfs_master2:
  seaweedfs_master3:
  seaweedfs_volume1:
  seaweedfs_volume2:
  seaweedfs_filer:
  postgres_data:
