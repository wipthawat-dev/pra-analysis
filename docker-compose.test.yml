version: '3.8'

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    volumes:
      - ./shared/schemas/sql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  ceph-rgw-test:
    image: quay.io/ceph/demo:latest
    environment:
      - MON_IP=0.0.0.0
      - CEPH_PUBLIC_NETWORK=0.0.0.0/0
      - CEPH_DEMO_UID=test-admin
      - CEPH_DEMO_ACCESS_KEY=testceph
      - CEPH_DEMO_SECRET_KEY=testceph123
      - CEPH_DEMO_BUCKET=test-bucket
      - RGW_CIVETWEB_PORT=9000
      - NETWORK_AUTO_DETECT=4
    ports:
      - "9010:9000"
    cap_add:
      - ALL
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "ceph health | grep -q HEALTH_OK || ceph health | grep -q HEALTH_WARN"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  qdrant-test:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: pra-analysis-test

