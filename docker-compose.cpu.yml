version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: ./apps/web-next/Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE}
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: ./apps/amulet-ai-service/Dockerfile
    environment:
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - TRITON_GRPC_URL=mock://cpu-only
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - EMBED_DIM=${EMBED_DIM}
    volumes:
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
